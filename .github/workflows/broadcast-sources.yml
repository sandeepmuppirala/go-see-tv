name: Live broadcast source verification
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * *'
  push:
    paths:
      - '.github/workflows/broadcast-sources.yml'
      - 'scripts/check-broadcast-sources.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sports broadcast source payloads
        run: node scripts/check-broadcast-sources.mjs
